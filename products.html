<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>All Products - BLOCKVERSE</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;600;700;800;900&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body class="bg-gray-950 text-white overflow-x-hidden">
    <!-- Header Container -->
    <div id="header-container"></div>
    
    <!-- Search Container -->
    <div id="search-container"></div>
    
    <!-- Side Cart Container -->
    <div id="sidecart-container"></div>

    <!-- Page Header -->
    <section class="pt-32 pb-12 relative bg-grid">
        <div class="absolute top-20 left-10 w-72 h-72 bg-purple-600/20 blob blur-3xl"></div>
        <div class="absolute bottom-0 right-10 w-64 h-64 bg-pink-600/20 blob blur-3xl"></div>
        <div class="max-w-7xl mx-auto px-6 relative z-10">
            <div class="text-center">
                <span class="text-purple-400 font-semibold text-sm uppercase tracking-wider">Our Collection</span>
                <h1 class="text-4xl md:text-6xl font-black mt-2 mb-4">
                    All <span class="gradient-text">Products</span>
                </h1>
                <p class="text-gray-400 max-w-2xl mx-auto">
                    Discover our complete collection of premium designer building blocks. From city scenes to epic mecha, find your next masterpiece.
                </p>
            </div>
        </div>
    </section>

    <!-- Filters & Products -->
    <section class="py-12">
        <div class="max-w-7xl mx-auto px-6">
            <div class="flex flex-col lg:flex-row gap-8">
                <!-- Sidebar Filters -->
                <aside class="lg:w-72 flex-shrink-0">
                    <div class="bg-white/5 backdrop-blur-sm border border-white/10 rounded-3xl p-6 sticky top-28">
                        <h3 class="text-xl font-bold mb-6 flex items-center gap-2">
                            <span>🎛️</span> Filters
                        </h3>
                        
                        <!-- Search -->
                        <div class="mb-6">
                            <label class="text-sm text-gray-400 mb-2 block">Search</label>
                            <div class="relative group">
                                <span class="absolute left-4 top-1/2 -translate-y-1/2 text-gray-500 group-focus-within:text-purple-400 transition-colors">🔍</span>
                                <input type="text" id="search-input" placeholder="Search products..." 
                                       class="w-full pl-12 pr-4 py-3 bg-gradient-to-r from-white/5 to-white/10 border border-white/20 rounded-xl text-white placeholder-gray-500 hover:border-purple-500/50 focus:border-purple-500 focus:ring-2 focus:ring-purple-500/20 transition-all duration-300">
                                <div class="absolute inset-0 rounded-xl bg-gradient-to-r from-purple-500/0 to-pink-500/0 group-focus-within:from-purple-500/5 group-focus-within:to-pink-500/5 pointer-events-none transition-all duration-300"></div>
                            </div>
                        </div>
                        
                        <!-- Categories -->
                        <div class="mb-6">
                            <label class="text-sm text-gray-400 mb-3 block">Category</label>
                            <div class="space-y-2">
                                <label class="flex items-center gap-3 cursor-pointer p-2 rounded-lg hover:bg-white/5 transition-colors group">
                                    <input type="checkbox" class="custom-checkbox" value="all" checked onchange="filterProducts()">
                                    <span class="flex items-center gap-2 group-hover:text-purple-400 transition-colors">
                                        <span class="text-lg">🌟</span> All Products
                                    </span>
                                </label>
                                <label class="flex items-center gap-3 cursor-pointer p-2 rounded-lg hover:bg-white/5 transition-colors group">
                                    <input type="checkbox" class="custom-checkbox category-filter" value="City" onchange="filterProducts()">
                                    <span class="flex items-center gap-2 group-hover:text-purple-400 transition-colors">
                                        <span class="text-lg">🏙️</span> City Series
                                    </span>
                                </label>
                                <label class="flex items-center gap-3 cursor-pointer p-2 rounded-lg hover:bg-white/5 transition-colors group">
                                    <input type="checkbox" class="custom-checkbox category-filter" value="Mecha" onchange="filterProducts()">
                                    <span class="flex items-center gap-2 group-hover:text-purple-400 transition-colors">
                                        <span class="text-lg">🤖</span> Mecha
                                    </span>
                                </label>
                                <label class="flex items-center gap-3 cursor-pointer p-2 rounded-lg hover:bg-white/5 transition-colors group">
                                    <input type="checkbox" class="custom-checkbox category-filter" value="Space" onchange="filterProducts()">
                                    <span class="flex items-center gap-2 group-hover:text-purple-400 transition-colors">
                                        <span class="text-lg">🚀</span> Space
                                    </span>
                                </label>
                                <label class="flex items-center gap-3 cursor-pointer p-2 rounded-lg hover:bg-white/5 transition-colors group">
                                    <input type="checkbox" class="custom-checkbox category-filter" value="Characters" onchange="filterProducts()">
                                    <span class="flex items-center gap-2 group-hover:text-purple-400 transition-colors">
                                        <span class="text-lg">🎭</span> Characters
                                    </span>
                                </label>
                            </div>
                        </div>
                        
                        <!-- Price Range -->
                        <div class="mb-6">
                            <label class="text-sm text-gray-400 mb-3 block">Price Range</label>
                            <div class="relative h-6 flex items-center">
                                <!-- Background Track -->
                                <div class="absolute left-0 right-0 h-2 bg-white/10 rounded-full"></div>
                                <!-- Fill Track -->
                                <div id="price-fill" class="absolute left-0 h-2 bg-gradient-to-r from-purple-500 to-pink-500 rounded-full pointer-events-none" style="width: 100%"></div>
                                <!-- Range Input -->
                                <input type="range" id="price-range" min="0" max="400" value="400" 
                                       class="absolute left-0 right-0 w-full h-2 bg-transparent rounded-full appearance-none cursor-pointer" 
                                       style="background: transparent;"
                                       onchange="filterProducts()" 
                                       oninput="document.getElementById('price-value').textContent='$'+this.value; document.getElementById('price-fill').style.width=((this.value/400)*100)+'%'">
                            </div>
                            <div class="flex justify-between text-sm mt-3">
                                <span class="px-3 py-1 bg-white/10 rounded-lg text-gray-300">$0</span>
                                <span id="price-value" class="px-3 py-1 bg-gradient-to-r from-purple-500/20 to-pink-500/20 rounded-lg text-purple-300 font-bold border border-purple-500/30">$400</span>
                            </div>
                        </div>
                        
                        <!-- Sort -->
                        <div class="mb-6">
                            <label class="text-sm text-gray-400 mb-2 block">Sort By</label>
                            <div class="relative group">
                                <select id="sort-select" class="w-full px-4 py-3 bg-gradient-to-r from-white/5 to-white/10 border border-white/20 rounded-xl text-white font-medium hover:border-purple-500/50 focus:border-purple-500 focus:ring-2 focus:ring-purple-500/20 transition-all duration-300" onchange="filterProducts()">
                                    <option value="featured">✨ Featured</option>
                                    <option value="price-low">💰 Price: Low to High</option>
                                    <option value="price-high">💎 Price: High to Low</option>
                                    <option value="name">🔤 Name A-Z</option>
                                    <option value="pieces">🧱 Most Pieces</option>
                                </select>
                                <div class="absolute inset-0 rounded-xl bg-gradient-to-r from-purple-500/0 via-purple-500/0 to-pink-500/0 group-hover:from-purple-500/10 group-hover:to-pink-500/10 pointer-events-none transition-all duration-300"></div>
                            </div>
                        </div>
                        
                        <!-- Reset -->
                        <button onclick="resetFilters()" class="w-full py-3 bg-white/10 border border-white/20 rounded-xl font-medium hover:bg-white/20 transition">
                            Reset Filters
                        </button>
                    </div>
                </aside>

                <!-- Products Grid -->
                <div class="flex-1">
                    <div class="flex items-center justify-between mb-6">
                        <p id="results-count" class="text-gray-400">Showing <span class="text-white font-bold">12</span> products</p>
                        <div class="flex items-center gap-2">
                            <button onclick="setView('grid')" id="grid-view-btn" class="p-2 bg-white/10 rounded-lg">
                                <svg class="w-5 h-5" fill="currentColor" viewBox="0 0 20 20">
                                    <path d="M5 3a2 2 0 00-2 2v2a2 2 0 002 2h2a2 2 0 002-2V5a2 2 0 00-2-2H5zM5 11a2 2 0 00-2 2v2a2 2 0 002 2h2a2 2 0 002-2v-2a2 2 0 00-2-2H5zM11 5a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2V5zM11 13a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2v-2z"/>
                                </svg>
                            </button>
                            <button onclick="setView('list')" id="list-view-btn" class="p-2 hover:bg-white/10 rounded-lg">
                                <svg class="w-5 h-5" fill="currentColor" viewBox="0 0 20 20">
                                    <path fill-rule="evenodd" d="M3 4a1 1 0 011-1h12a1 1 0 110 2H4a1 1 0 01-1-1zm0 4a1 1 0 011-1h12a1 1 0 110 2H4a1 1 0 01-1-1zm0 4a1 1 0 011-1h12a1 1 0 110 2H4a1 1 0 01-1-1zm0 4a1 1 0 011-1h12a1 1 0 110 2H4a1 1 0 01-1-1z" clip-rule="evenodd"/>
                                </svg>
                            </button>
                        </div>
                    </div>
                    
                    <div id="products-grid" class="grid md:grid-cols-2 xl:grid-cols-3 gap-6">
                        <!-- Products injected here -->
                    </div>
                    
                    <!-- Empty State -->
                    <div id="empty-state" class="hidden text-center py-20">
                        <div class="text-6xl mb-4">🔍</div>
                        <h3 class="text-2xl font-bold mb-2">No products found</h3>
                        <p class="text-gray-400">Try adjusting your filters or search terms</p>
                    </div>
                </div>
            </div>
        </div>
    </section>

    <!-- Footer Container -->
    <div id="footer-container"></div>

    <script src="app.js"></script>
    <script>
        // Initialize page
        document.addEventListener('DOMContentLoaded', function() {
            initPage('products');
            
            // Check for search param from URL
            var searchParam = getUrlParam('search');
            if (searchParam) {
                document.getElementById('search-input').value = searchParam;
            }
        });
        
        let currentView = 'grid';
        let filteredProducts = [...products];

        function filterProducts() {
            const searchTerm = document.getElementById('search-input').value.toLowerCase();
            const priceMax = parseInt(document.getElementById('price-range').value);
            const sortBy = document.getElementById('sort-select').value;
            const categoryFilters = document.querySelectorAll('.category-filter:checked');
            const selectedCategories = Array.from(categoryFilters).map(cb => cb.value);
            
            document.getElementById('price-value').textContent = `$${priceMax}`;
            
            filteredProducts = products.filter(product => {
                const matchesSearch = product.name.toLowerCase().includes(searchTerm) || 
                                     product.category.toLowerCase().includes(searchTerm);
                const matchesPrice = product.price <= priceMax;
                const matchesCategory = selectedCategories.length === 0 || selectedCategories.includes(product.category);
                
                return matchesSearch && matchesPrice && matchesCategory;
            });
            
            // Sort
            switch(sortBy) {
                case 'price-low':
                    filteredProducts.sort((a, b) => a.price - b.price);
                    break;
                case 'price-high':
                    filteredProducts.sort((a, b) => b.price - a.price);
                    break;
                case 'name':
                    filteredProducts.sort((a, b) => a.name.localeCompare(b.name));
                    break;
                case 'pieces':
                    filteredProducts.sort((a, b) => b.pieces - a.pieces);
                    break;
            }
            
            renderProducts();
        }

        function renderProducts() {
            const grid = document.getElementById('products-grid');
            const emptyState = document.getElementById('empty-state');
            const resultsCount = document.getElementById('results-count');
            
            if (filteredProducts.length === 0) {
                grid.classList.add('hidden');
                emptyState.classList.remove('hidden');
            } else {
                grid.classList.remove('hidden');
                emptyState.classList.add('hidden');
                
                if (currentView === 'grid') {
                    grid.className = 'grid md:grid-cols-2 xl:grid-cols-3 gap-6';
                    grid.innerHTML = filteredProducts.map(product => createProductCard(product)).join('');
                } else {
                    grid.className = 'flex flex-col gap-4';
                    grid.innerHTML = filteredProducts.map(product => createListCard(product)).join('');
                }
            }
            
            resultsCount.innerHTML = `Showing <span class="text-white font-bold">${filteredProducts.length}</span> products`;
        }

        function createListCard(product) {
            var badgeColors = {
                'HOT': 'from-orange-500 to-red-500',
                'NEW': 'from-green-500 to-emerald-500',
                'SALE': 'from-pink-500 to-rose-500',
                'EXCLUSIVE': 'from-purple-500 to-violet-500',
                'LIMITED': 'from-yellow-500 to-amber-500'
            };
            
            var badgeIcons = {
                'HOT': '🔥',
                'NEW': '✨',
                'SALE': '💰',
                'EXCLUSIVE': '👑',
                'LIMITED': '⚡'
            };
            
            var badgeHtml = '';
            if (product.badge) {
                badgeHtml = '<span class="flex items-center gap-1 px-2.5 py-1 bg-gradient-to-r ' + (badgeColors[product.badge] || '') + ' rounded-full text-xs font-bold shadow-lg">' +
                    '<span>' + badgeIcons[product.badge] + '</span>' +
                    '<span>' + product.badge + '</span>' +
                '</span>';
            }
            
            var originalPriceHtml = '';
            var discountHtml = '';
            if (product.originalPrice) {
                var discount = Math.round((1 - product.price / product.originalPrice) * 100);
                originalPriceHtml = '<span class="text-sm text-gray-500 line-through">$' + product.originalPrice + '</span>';
                discountHtml = '<span class="text-xs font-bold text-green-400 ml-1">-' + discount + '%</span>';
            }
            
            // Star rating
            var rating = product.rating || 4.5;
            var starsHtml = '';
            for (var i = 0; i < 5; i++) {
                if (i < Math.floor(rating)) {
                    starsHtml += '<span class="text-yellow-400">★</span>';
                } else {
                    starsHtml += '<span class="text-gray-600">★</span>';
                }
            }
            
            return '<div class="group relative bg-gradient-to-r from-gray-900 to-gray-950 border border-white/10 rounded-2xl overflow-hidden hover:border-purple-500/30 hover:shadow-[0_10px_40px_-15px_rgba(168,85,247,0.3)] transition-all duration-500">' +
                // Gradient overlay on hover
                '<div class="absolute inset-0 bg-gradient-to-r from-purple-600/5 to-pink-600/5 opacity-0 group-hover:opacity-100 transition-opacity duration-500 pointer-events-none"></div>' +
                
                '<div class="relative flex flex-col sm:flex-row gap-6 p-5">' +
                    // Image Section
                    '<a href="product-detail.html?id=' + product.id + '" class="relative w-full sm:w-40 h-40 bg-gradient-to-br from-gray-800 via-gray-900 to-black rounded-xl flex items-center justify-center flex-shrink-0 cursor-pointer overflow-hidden group/img">' +
                        // Background glow
                        '<div class="absolute inset-0 bg-purple-500/10 opacity-0 group-hover/img:opacity-100 transition-opacity duration-300"></div>' +
                        // Product emoji
                        '<span class="text-7xl group-hover/img:scale-110 group-hover/img:rotate-3 transition-all duration-500 drop-shadow-xl">' + product.image + '</span>' +
                        // Badge
                        (product.badge ? '<div class="absolute top-2 left-2">' + badgeHtml + '</div>' : '') +
                    '</a>' +
                    
                    // Content Section
                    '<div class="flex-1 flex flex-col justify-between min-w-0">' +
                        '<div>' +
                            // Category and Rating Row
                            '<div class="flex items-center justify-between mb-2">' +
                                '<div class="flex items-center gap-2">' +
                                    '<span class="text-xs font-semibold text-purple-400 px-2 py-0.5 bg-purple-500/10 border border-purple-500/20 rounded-lg">' + product.category + '</span>' +
                                    '<span class="text-xs text-gray-500">• ' + product.pieces.toLocaleString() + ' pieces</span>' +
                                '</div>' +
                                '<div class="hidden sm:flex items-center gap-1 text-xs">' +
                                    starsHtml +
                                    '<span class="text-gray-500 ml-1">(' + (product.reviews || 0) + ')</span>' +
                                '</div>' +
                            '</div>' +
                            
                            // Product Name
                            '<a href="product-detail.html?id=' + product.id + '" class="cursor-pointer block">' +
                                '<h3 class="text-xl font-bold text-white group-hover:text-transparent group-hover:bg-clip-text group-hover:bg-gradient-to-r group-hover:from-purple-400 group-hover:to-pink-400 transition-all duration-300 truncate">' + product.name + '</h3>' +
                            '</a>' +
                            
                            // Description
                            '<p class="text-gray-400 text-sm mt-2 line-clamp-2 leading-relaxed">' + product.description + '</p>' +
                        '</div>' +
                        
                        // Price and Action Row
                        '<div class="flex items-center justify-between mt-4 pt-4 border-t border-white/5">' +
                            '<div class="flex flex-col">' +
                                '<div class="flex items-center gap-2">' +
                                    '<span class="text-2xl font-black bg-gradient-to-r from-white to-gray-300 bg-clip-text text-transparent">$' + product.price + '</span>' +
                                    discountHtml +
                                '</div>' +
                                (product.originalPrice ? '<span class="text-xs text-gray-500 line-through">Was $' + product.originalPrice + '</span>' : '<span class="text-xs text-gray-500">Free shipping</span>') +
                            '</div>' +
                            '<button type="button" class="add-to-cart-btn group/btn relative px-6 py-3 cursor-pointer overflow-hidden rounded-xl" data-id="' + product.id + '">' +
                                '<div class="absolute inset-0 bg-gradient-to-r from-purple-600 to-pink-600"></div>' +
                                '<div class="absolute inset-0 bg-gradient-to-r from-purple-500 to-pink-500 opacity-0 group-hover/btn:opacity-100 transition-opacity"></div>' +
                                '<div class="absolute inset-0 bg-gradient-to-r from-transparent via-white/20 to-transparent -translate-x-full group-hover/btn:translate-x-full transition-transform duration-500"></div>' +
                                '<span class="relative flex items-center gap-2 font-bold text-white">' +
                                    '<svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M12 4v16m8-8H4"/></svg>' +
                                    'Add to Cart' +
                                '</span>' +
                            '</button>' +
                        '</div>' +
                    '</div>' +
                '</div>' +
            '</div>';
        }

        function setView(view) {
            currentView = view;
            document.getElementById('grid-view-btn').className = view === 'grid' ? 'p-2 bg-white/10 rounded-lg' : 'p-2 hover:bg-white/10 rounded-lg';
            document.getElementById('list-view-btn').className = view === 'list' ? 'p-2 bg-white/10 rounded-lg' : 'p-2 hover:bg-white/10 rounded-lg';
            renderProducts();
        }

        function resetFilters() {
            document.getElementById('search-input').value = '';
            document.getElementById('price-range').value = 400;
            document.getElementById('sort-select').value = 'featured';
            document.querySelectorAll('.category-filter').forEach(cb => cb.checked = false);
            filterProducts();
        }

        // Initialize
        document.addEventListener('DOMContentLoaded', () => {
            // Check URL params for category filter
            const categoryParam = getUrlParam('category');
            if (categoryParam) {
                const categoryMap = {
                    'city': 'City',
                    'mecha': 'Mecha',
                    'space': 'Space',
                    'characters': 'Characters'
                };
                const category = categoryMap[categoryParam.toLowerCase()];
                if (category) {
                    document.querySelector(`.category-filter[value="${category}"]`).checked = true;
                }
            }
            
            filterProducts();
            
            // Search debounce
            document.getElementById('search-input').addEventListener('input', debounce(filterProducts, 300));
        });

        function debounce(func, wait) {
            let timeout;
            return function executedFunction(...args) {
                const later = () => {
                    clearTimeout(timeout);
                    func(...args);
                };
                clearTimeout(timeout);
                timeout = setTimeout(later, wait);
            };
        }
    </script>
</body>
</html>
