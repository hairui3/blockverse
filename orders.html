<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Orders - BLOCKVERSE</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;600;700;800;900&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body class="bg-gray-950 text-white overflow-x-hidden">
    <!-- Header Container -->
    <div id="header-container"></div>
    
    <!-- Search Container -->
    <div id="search-container"></div>
    
    <!-- Side Cart Container -->
    <div id="sidecart-container"></div>

    <!-- Page Header -->
    <section class="pt-32 pb-8 relative">
        <div class="absolute top-20 left-10 w-72 h-72 bg-purple-600/20 rounded-full blur-[120px]"></div>
        <div class="absolute bottom-0 right-10 w-64 h-64 bg-pink-600/20 rounded-full blur-[100px]"></div>
        <div class="max-w-7xl mx-auto px-6 relative z-10">
            <div class="flex items-center gap-4 mb-4">
                <a href="account.html" class="text-gray-400 hover:text-white transition">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"/>
                    </svg>
                </a>
                <h1 class="text-4xl md:text-5xl font-black">
                    My <span class="gradient-text">Orders</span> 📦
                </h1>
            </div>
            <p class="text-gray-400">Track and manage your orders</p>
        </div>
    </section>

    <!-- Orders Content -->
    <section class="py-8 pb-20">
        <div class="max-w-5xl mx-auto px-6">
            <!-- Order Stats -->
            <div class="grid grid-cols-2 md:grid-cols-4 gap-4 mb-8">
                <div class="bg-white/5 backdrop-blur-sm border border-white/10 rounded-2xl p-4 text-center">
                    <div id="stat-total" class="text-3xl font-black gradient-text">0</div>
                    <div class="text-gray-400 text-sm">Total Orders</div>
                </div>
                <div class="bg-white/5 backdrop-blur-sm border border-white/10 rounded-2xl p-4 text-center">
                    <div id="stat-processing" class="text-3xl font-black text-yellow-400">0</div>
                    <div class="text-gray-400 text-sm">Processing</div>
                </div>
                <div class="bg-white/5 backdrop-blur-sm border border-white/10 rounded-2xl p-4 text-center">
                    <div id="stat-shipped" class="text-3xl font-black text-blue-400">0</div>
                    <div class="text-gray-400 text-sm">Shipped</div>
                </div>
                <div class="bg-white/5 backdrop-blur-sm border border-white/10 rounded-2xl p-4 text-center">
                    <div id="stat-delivered" class="text-3xl font-black text-green-400">0</div>
                    <div class="text-gray-400 text-sm">Delivered</div>
                </div>
            </div>

            <!-- Filter Tabs -->
            <div class="flex flex-wrap gap-2 mb-6">
                <button onclick="filterOrders('all')" class="order-filter active px-5 py-2 bg-gradient-to-r from-purple-600 to-pink-600 rounded-full font-medium transition" data-filter="all">
                    All Orders
                </button>
                <button onclick="filterOrders('processing')" class="order-filter px-5 py-2 bg-white/10 hover:bg-white/20 rounded-full font-medium transition" data-filter="processing">
                    🟡 Processing
                </button>
                <button onclick="filterOrders('shipped')" class="order-filter px-5 py-2 bg-white/10 hover:bg-white/20 rounded-full font-medium transition" data-filter="shipped">
                    🔵 Shipped
                </button>
                <button onclick="filterOrders('delivered')" class="order-filter px-5 py-2 bg-white/10 hover:bg-white/20 rounded-full font-medium transition" data-filter="delivered">
                    🟢 Delivered
                </button>
            </div>

            <!-- Orders List -->
            <div id="orders-list" class="space-y-4">
                <!-- Orders will be loaded here -->
            </div>

            <!-- Empty State -->
            <div id="empty-orders" class="hidden text-center py-20 bg-white/5 backdrop-blur-sm border border-white/10 rounded-3xl">
                <div class="text-8xl mb-6">📦</div>
                <h3 class="text-2xl font-bold mb-2">No orders yet</h3>
                <p class="text-gray-400 mb-8">Start shopping to see your orders here!</p>
                <a href="products.html" class="inline-block px-8 py-4 bg-gradient-to-r from-purple-600 to-pink-600 rounded-2xl font-bold text-lg hover:opacity-90 transition">
                    Shop Now 🚀
                </a>
            </div>
        </div>
    </section>

    <!-- Order Detail Modal -->
    <div id="order-modal" class="fixed inset-0 bg-black/80 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
        <div class="bg-gray-900 border border-white/10 rounded-3xl max-w-2xl w-full max-h-[90vh] overflow-y-auto">
            <div class="p-6 border-b border-white/10 flex items-center justify-between sticky top-0 bg-gray-900 z-10">
                <h3 class="text-xl font-bold">Order Details</h3>
                <button onclick="closeOrderModal()" class="p-2 hover:bg-white/10 rounded-xl transition">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/>
                    </svg>
                </button>
            </div>
            <div id="order-modal-content" class="p-6">
                <!-- Order details loaded here -->
            </div>
        </div>
    </div>

    <!-- Footer Container -->
    <div id="footer-container"></div>

    <script src="app.js"></script>
    <script>
        var currentFilter = 'all';
        
        document.addEventListener('DOMContentLoaded', function() {
            initPage('');
            
            if (!isLoggedIn()) {
                window.location.href = 'login.html?redirect=orders.html';
                return;
            }
            
            // Create demo orders if none exist
            createDemoOrders();
            
            loadOrders();
            updateStats();
        });
        
        function createDemoOrders() {
            var orders = getOrders();
            if (orders.length === 0) {
                // Create some demo orders
                var demoOrders = [
                    {
                        id: 'BLK-' + Date.now().toString(36).toUpperCase(),
                        date: new Date(Date.now() - 2 * 24 * 60 * 60 * 1000).toISOString(),
                        status: 'processing',
                        items: [
                            { id: 1, name: 'Neon City Street', price: 89.99, image: '🏪', quantity: 1 },
                            { id: 4, name: 'Pixel Art Mario', price: 49.99, image: '🎮', quantity: 2 }
                        ],
                        subtotal: 189.97,
                        shipping: 0,
                        tax: 15.20,
                        total: 205.17,
                        shippingAddress: { name: 'John Doe', address: '123 Main St', city: 'Los Angeles', state: 'CA', zip: '90001' }
                    },
                    {
                        id: 'BLK-' + (Date.now() - 100000).toString(36).toUpperCase(),
                        date: new Date(Date.now() - 7 * 24 * 60 * 60 * 1000).toISOString(),
                        status: 'shipped',
                        items: [
                            { id: 2, name: 'Gundam RX-78', price: 159.99, image: '🤖', quantity: 1 }
                        ],
                        subtotal: 159.99,
                        shipping: 0,
                        tax: 12.80,
                        total: 172.79,
                        shippingAddress: { name: 'John Doe', address: '123 Main St', city: 'Los Angeles', state: 'CA', zip: '90001' },
                        trackingNumber: '1Z999AA10123456784'
                    },
                    {
                        id: 'BLK-' + (Date.now() - 200000).toString(36).toUpperCase(),
                        date: new Date(Date.now() - 14 * 24 * 60 * 60 * 1000).toISOString(),
                        status: 'delivered',
                        items: [
                            { id: 5, name: 'Sakura Temple', price: 199.99, image: '🏯', quantity: 1 },
                            { id: 12, name: 'Pikachu Giant', price: 69.99, image: '⚡', quantity: 1 }
                        ],
                        subtotal: 269.98,
                        shipping: 0,
                        tax: 21.60,
                        total: 291.58,
                        shippingAddress: { name: 'John Doe', address: '123 Main St', city: 'Los Angeles', state: 'CA', zip: '90001' },
                        deliveredDate: new Date(Date.now() - 10 * 24 * 60 * 60 * 1000).toISOString()
                    }
                ];
                
                saveOrders(demoOrders);
            }
        }
        
        function updateStats() {
            var orders = getOrders();
            var processing = 0, shipped = 0, delivered = 0;
            
            for (var i = 0; i < orders.length; i++) {
                if (orders[i].status === 'processing') processing++;
                else if (orders[i].status === 'shipped') shipped++;
                else if (orders[i].status === 'delivered') delivered++;
            }
            
            document.getElementById('stat-total').textContent = orders.length;
            document.getElementById('stat-processing').textContent = processing;
            document.getElementById('stat-shipped').textContent = shipped;
            document.getElementById('stat-delivered').textContent = delivered;
        }
        
        function loadOrders() {
            var orders = getOrders();
            var container = document.getElementById('orders-list');
            var emptyState = document.getElementById('empty-orders');
            
            var filtered = orders;
            if (currentFilter !== 'all') {
                filtered = [];
                for (var i = 0; i < orders.length; i++) {
                    if (orders[i].status === currentFilter) {
                        filtered.push(orders[i]);
                    }
                }
            }
            
            if (filtered.length === 0) {
                container.classList.add('hidden');
                emptyState.classList.remove('hidden');
                return;
            }
            
            container.classList.remove('hidden');
            emptyState.classList.add('hidden');
            
            var html = '';
            for (var i = 0; i < filtered.length; i++) {
                var order = filtered[i];
                html += createOrderCard(order);
            }
            
            container.innerHTML = html;
        }
        
        function createOrderCard(order) {
            var statusColors = {
                'processing': 'bg-yellow-500/20 text-yellow-400 border-yellow-500/30',
                'shipped': 'bg-blue-500/20 text-blue-400 border-blue-500/30',
                'delivered': 'bg-green-500/20 text-green-400 border-green-500/30',
                'cancelled': 'bg-red-500/20 text-red-400 border-red-500/30'
            };
            
            var statusIcons = {
                'processing': '🟡',
                'shipped': '🔵',
                'delivered': '🟢',
                'cancelled': '🔴'
            };
            
            var date = new Date(order.date);
            var dateStr = date.toLocaleDateString('en-US', { year: 'numeric', month: 'short', day: 'numeric' });
            
            var itemsPreview = '';
            for (var i = 0; i < Math.min(order.items.length, 3); i++) {
                itemsPreview += '<div class="w-12 h-12 bg-gradient-to-br from-gray-800 to-gray-900 rounded-lg flex items-center justify-center text-2xl border border-white/10">' + order.items[i].image + '</div>';
            }
            if (order.items.length > 3) {
                itemsPreview += '<div class="w-12 h-12 bg-white/10 rounded-lg flex items-center justify-center text-sm font-bold border border-white/10">+' + (order.items.length - 3) + '</div>';
            }
            
            return '<div class="bg-white/5 backdrop-blur-sm border border-white/10 rounded-2xl p-6 hover:border-purple-500/30 transition cursor-pointer" onclick="openOrderModal(\'' + order.id + '\')">' +
                '<div class="flex flex-col md:flex-row md:items-center justify-between gap-4 mb-4">' +
                    '<div>' +
                        '<div class="flex items-center gap-2 mb-1">' +
                            '<span class="font-bold text-lg">' + order.id + '</span>' +
                            '<span class="px-3 py-1 rounded-full text-xs font-medium border ' + statusColors[order.status] + '">' + statusIcons[order.status] + ' ' + order.status.charAt(0).toUpperCase() + order.status.slice(1) + '</span>' +
                        '</div>' +
                        '<p class="text-gray-400 text-sm">Ordered on ' + dateStr + '</p>' +
                    '</div>' +
                    '<div class="text-right">' +
                        '<div class="text-2xl font-black gradient-text">$' + order.total.toFixed(2) + '</div>' +
                        '<p class="text-gray-400 text-sm">' + order.items.length + ' item' + (order.items.length > 1 ? 's' : '') + '</p>' +
                    '</div>' +
                '</div>' +
                '<div class="flex items-center gap-2">' + itemsPreview + '</div>' +
            '</div>';
        }
        
        function filterOrders(filter) {
            currentFilter = filter;
            
            var buttons = document.querySelectorAll('.order-filter');
            for (var i = 0; i < buttons.length; i++) {
                var btn = buttons[i];
                if (btn.getAttribute('data-filter') === filter) {
                    btn.className = 'order-filter active px-5 py-2 bg-gradient-to-r from-purple-600 to-pink-600 rounded-full font-medium transition';
                } else {
                    btn.className = 'order-filter px-5 py-2 bg-white/10 hover:bg-white/20 rounded-full font-medium transition';
                }
            }
            
            loadOrders();
        }
        
        function openOrderModal(orderId) {
            var order = getOrderById(orderId);
            if (!order) return;
            
            var modal = document.getElementById('order-modal');
            var content = document.getElementById('order-modal-content');
            
            var statusColors = {
                'processing': 'bg-yellow-500/20 text-yellow-400 border-yellow-500/30',
                'shipped': 'bg-blue-500/20 text-blue-400 border-blue-500/30',
                'delivered': 'bg-green-500/20 text-green-400 border-green-500/30'
            };
            
            var date = new Date(order.date);
            var dateStr = date.toLocaleDateString('en-US', { year: 'numeric', month: 'long', day: 'numeric' });
            
            var itemsHtml = '';
            for (var i = 0; i < order.items.length; i++) {
                var item = order.items[i];
                itemsHtml += '<div class="flex items-center gap-4 py-3 border-b border-white/10 last:border-0">' +
                    '<div class="w-16 h-16 bg-gradient-to-br from-gray-800 to-gray-900 rounded-xl flex items-center justify-center text-3xl">' + item.image + '</div>' +
                    '<div class="flex-1">' +
                        '<h4 class="font-bold">' + item.name + '</h4>' +
                        '<p class="text-gray-400 text-sm">Qty: ' + item.quantity + '</p>' +
                    '</div>' +
                    '<div class="font-bold">$' + (item.price * item.quantity).toFixed(2) + '</div>' +
                '</div>';
            }
            
            var trackingHtml = '';
            if (order.trackingNumber) {
                trackingHtml = '<div class="bg-blue-500/10 border border-blue-500/30 rounded-xl p-4 mb-6">' +
                    '<div class="flex items-center gap-2 text-blue-400 font-medium mb-2">' +
                        '<span>📦</span> Tracking Number' +
                    '</div>' +
                    '<p class="font-mono text-lg">' + order.trackingNumber + '</p>' +
                '</div>';
            }
            
            content.innerHTML = '<div class="space-y-6">' +
                '<div class="flex items-center justify-between">' +
                    '<div>' +
                        '<h4 class="text-2xl font-bold">' + order.id + '</h4>' +
                        '<p class="text-gray-400">' + dateStr + '</p>' +
                    '</div>' +
                    '<span class="px-4 py-2 rounded-full text-sm font-medium border ' + statusColors[order.status] + '">' + order.status.charAt(0).toUpperCase() + order.status.slice(1) + '</span>' +
                '</div>' +
                
                trackingHtml +
                
                '<div class="bg-white/5 rounded-xl p-4">' +
                    '<h4 class="font-bold mb-3">Order Items</h4>' +
                    itemsHtml +
                '</div>' +
                
                '<div class="grid md:grid-cols-2 gap-4">' +
                    '<div class="bg-white/5 rounded-xl p-4">' +
                        '<h4 class="font-bold mb-3">Shipping Address</h4>' +
                        '<p class="text-gray-400">' + (order.shippingAddress.name || 'Customer') + '</p>' +
                        '<p class="text-gray-400">' + (order.shippingAddress.address || '') + '</p>' +
                        '<p class="text-gray-400">' + (order.shippingAddress.city || '') + ', ' + (order.shippingAddress.state || '') + ' ' + (order.shippingAddress.zip || '') + '</p>' +
                    '</div>' +
                    '<div class="bg-white/5 rounded-xl p-4">' +
                        '<h4 class="font-bold mb-3">Order Summary</h4>' +
                        '<div class="space-y-2 text-sm">' +
                            '<div class="flex justify-between"><span class="text-gray-400">Subtotal</span><span>$' + order.subtotal.toFixed(2) + '</span></div>' +
                            '<div class="flex justify-between"><span class="text-gray-400">Shipping</span><span>' + (order.shipping === 0 ? 'FREE' : '$' + order.shipping.toFixed(2)) + '</span></div>' +
                            '<div class="flex justify-between"><span class="text-gray-400">Tax</span><span>$' + order.tax.toFixed(2) + '</span></div>' +
                            '<div class="flex justify-between font-bold text-lg pt-2 border-t border-white/10"><span>Total</span><span class="gradient-text">$' + order.total.toFixed(2) + '</span></div>' +
                        '</div>' +
                    '</div>' +
                '</div>' +
                
                '<div class="flex gap-4">' +
                    '<button onclick="reorderItems(\'' + order.id + '\')" class="flex-1 py-3 bg-gradient-to-r from-purple-600 to-pink-600 rounded-xl font-bold hover:opacity-90 transition">Reorder</button>' +
                    '<button onclick="closeOrderModal()" class="flex-1 py-3 bg-white/10 border border-white/20 rounded-xl font-bold hover:bg-white/20 transition">Close</button>' +
                '</div>' +
            '</div>';
            
            modal.classList.remove('hidden');
            document.body.style.overflow = 'hidden';
        }
        
        function closeOrderModal() {
            document.getElementById('order-modal').classList.add('hidden');
            document.body.style.overflow = '';
        }
        
        function reorderItems(orderId) {
            var order = getOrderById(orderId);
            if (!order) return;
            
            for (var i = 0; i < order.items.length; i++) {
                var item = order.items[i];
                var product = getProductById(item.id);
                if (product) {
                    for (var j = 0; j < item.quantity; j++) {
                        addToCart(product);
                    }
                }
            }
            
            closeOrderModal();
            showToast('Items added to cart!', 'success');
            openSideCart();
        }
        
        // Close modal on escape key
        document.addEventListener('keydown', function(e) {
            if (e.key === 'Escape') {
                closeOrderModal();
            }
        });
    </script>
</body>
</html>
