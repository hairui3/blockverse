<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - BLOCKVERSE</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;600;700;800;900&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body class="bg-gray-950 text-white overflow-x-hidden min-h-screen">
    <!-- Header Container -->
    <div id="header-container"></div>
    
    <!-- Search Container -->
    <div id="search-container"></div>
    
    <!-- Side Cart Container -->
    <div id="sidecart-container"></div>

    <!-- Login Section -->
    <section class="min-h-screen flex items-center justify-center pt-28 pb-12 relative bg-grid">
        <!-- Background blobs -->
        <div class="absolute top-20 left-10 w-72 h-72 bg-purple-600/30 blob blur-3xl"></div>
        <div class="absolute bottom-20 right-10 w-96 h-96 bg-pink-600/20 blob blur-3xl"></div>
        <div class="absolute top-1/2 left-1/2 w-64 h-64 bg-cyan-500/20 blob blur-3xl"></div>
        
        <div class="max-w-md w-full mx-auto px-6 relative z-10">
            <div class="bg-white/5 backdrop-blur-xl border border-white/10 rounded-3xl p-8 md:p-10">
                <!-- Header -->
                <div class="text-center mb-8">
                    <div class="w-20 h-20 bg-gradient-to-br from-purple-500 to-pink-500 rounded-2xl flex items-center justify-center text-4xl mx-auto mb-4 float-animation">
                        🔐
                    </div>
                    <h1 class="text-3xl font-black mb-2">Welcome Back!</h1>
                    <p class="text-gray-400">Login to your BLOCKVERSE account</p>
                </div>

                <!-- Login Form -->
                <form id="login-form" onsubmit="handleLogin(event)" class="space-y-5">
                    <div>
                        <label class="block text-sm text-gray-400 mb-2">Email Address</label>
                        <div class="relative">
                            <span class="absolute left-4 top-1/2 -translate-y-1/2 text-gray-500">📧</span>
                            <input type="email" id="login-email" required
                                   class="w-full pl-12 pr-4 py-3 bg-white/10 border border-white/20 rounded-xl text-white placeholder-gray-500 focus:border-purple-500 transition"
                                   placeholder="your@email.com">
                        </div>
                    </div>

                    <div>
                        <label class="block text-sm text-gray-400 mb-2">Password</label>
                        <div class="relative">
                            <span class="absolute left-4 top-1/2 -translate-y-1/2 text-gray-500">🔒</span>
                            <input type="password" id="login-password" required
                                   class="w-full pl-12 pr-12 py-3 bg-white/10 border border-white/20 rounded-xl text-white placeholder-gray-500 focus:border-purple-500 transition"
                                   placeholder="••••••••">
                            <button type="button" onclick="togglePassword('login-password')" 
                                    class="absolute right-4 top-1/2 -translate-y-1/2 text-gray-500 hover:text-white transition">
                                👁️
                            </button>
                        </div>
                    </div>

                    <div class="flex items-center justify-between">
                        <label class="flex items-center gap-2 cursor-pointer">
                            <input type="checkbox" id="remember-me" class="custom-checkbox">
                            <span class="text-sm text-gray-400">Remember me</span>
                        </label>
                        <a href="#" class="text-sm text-purple-400 hover:text-purple-300 transition">Forgot password?</a>
                    </div>

                    <div id="login-error" class="hidden bg-red-500/20 border border-red-500/50 rounded-xl p-4 text-red-300 text-sm">
                        Invalid email or password
                    </div>

                    <button type="submit" class="w-full py-4 bg-gradient-to-r from-purple-600 to-pink-600 rounded-xl font-bold text-lg hover:opacity-90 transition btn-glow">
                        Login 🚀
                    </button>
                </form>

                <!-- Divider -->
                <div class="flex items-center gap-4 my-8">
                    <div class="flex-1 h-px bg-white/10"></div>
                    <span class="text-gray-500 text-sm">or continue with</span>
                    <div class="flex-1 h-px bg-white/10"></div>
                </div>

                <!-- Social Login -->
                <div class="grid grid-cols-3 gap-4">
                    <button class="py-3 bg-white/10 border border-white/20 rounded-xl hover:bg-white/20 transition flex items-center justify-center text-xl">
                        🔵
                    </button>
                    <button class="py-3 bg-white/10 border border-white/20 rounded-xl hover:bg-white/20 transition flex items-center justify-center text-xl">
                        🍎
                    </button>
                    <button class="py-3 bg-white/10 border border-white/20 rounded-xl hover:bg-white/20 transition flex items-center justify-center text-xl">
                        📧
                    </button>
                </div>

                <!-- Register Link -->
                <p class="text-center text-gray-400 mt-8">
                    Don't have an account? 
                    <a href="register.html" class="text-purple-400 hover:text-purple-300 transition font-medium">Sign up free</a>
                </p>
            </div>

            <!-- Demo Credentials -->
            <div class="mt-6 bg-yellow-500/10 border border-yellow-500/30 rounded-2xl p-4 text-center">
                <p class="text-yellow-300 text-sm font-medium mb-1">🎮 Demo Account</p>
                <p class="text-gray-400 text-sm">Email: demo@blockverse.com</p>
                <p class="text-gray-400 text-sm">Password: demo123</p>
                <button onclick="fillDemoCredentials()" class="mt-2 px-4 py-1 bg-yellow-500/20 rounded-lg text-yellow-300 text-sm hover:bg-yellow-500/30 transition">
                    Use Demo Account
                </button>
            </div>
        </div>
    </section>

    <!-- Footer Container -->
    <div id="footer-container"></div>

    <script src="app.js"></script>
    <script>
        // Initialize page
        document.addEventListener('DOMContentLoaded', function() {
            initPage('');
            
            // Check if already logged in
            if (isLoggedIn()) {
                window.location.href = 'index.html';
            }
            
            // Create demo user if not exists
            var users = getUsers();
            var demoExists = false;
            for (var i = 0; i < users.length; i++) {
                if (users[i].email === 'demo@blockverse.com') {
                    demoExists = true;
                    break;
                }
            }
            if (!demoExists) {
                registerUser({
                    username: 'demo_user',
                    email: 'demo@blockverse.com',
                    password: 'demo123',
                    firstName: 'Demo',
                    lastName: 'User'
                });
            }
        });

        function handleLogin(e) {
            e.preventDefault();
            
            var email = document.getElementById('login-email').value;
            var password = document.getElementById('login-password').value;
            var errorEl = document.getElementById('login-error');
            
            var result = loginUser(email, password);
            
            if (result.success) {
                showToast('Login successful! Welcome back!', 'success');
                
                // Check if there's a redirect URL
                var redirect = getUrlParam('redirect') || 'index.html';
                setTimeout(function() {
                    window.location.href = redirect;
                }, 1000);
            } else {
                errorEl.textContent = result.message;
                errorEl.classList.remove('hidden');
                
                // Shake animation
                errorEl.classList.add('animate-shake');
                setTimeout(function() {
                    errorEl.classList.remove('animate-shake');
                }, 500);
            }
        }

        function togglePassword(inputId) {
            var input = document.getElementById(inputId);
            input.type = input.type === 'password' ? 'text' : 'password';
        }

        function fillDemoCredentials() {
            document.getElementById('login-email').value = 'demo@blockverse.com';
            document.getElementById('login-password').value = 'demo123';
        }
    </script>
</body>
</html>
